# Desenvolvimento: sobe a `api` e o `web`. O banco, a autenticação e os arquivos ficam no Supabase (na nuvem ou local),
# configurado no `.env` da raiz (copie de `.env.example`). O `mobile` não entra: o app é gerado como APK, fora daqui.
#
#   docker compose up --build        # api em http://localhost:3333, web em http://localhost:3000
services:
  api:
    build: ./api
    env_file: .env
    environment:
      PORT: 3333
      # O simulador do SAP vive na própria api; sobrescreva no .env para apontar para outro endereço.
      SAP_SIMULADO: ${SAP_SIMULADO:-true}
      SAP_API_URL: ${SAP_API_URL:-http://localhost:3333/sap-simulado}
      SAP_API_TOKEN: ${SAP_API_TOKEN:-token-de-desenvolvimento}
      PAINEL_URL: ${PAINEL_URL:-http://localhost:3000}
    ports:
      - "3333:3333"
    # Para alcançar um Supabase local (supabase start) rodando na máquina: use host.docker.internal no .env.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build: ./web
    environment:
      PORT: 3000
      API_URL: http://api:3333
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
